<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор семантического ядра</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        .task-card {
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        .task-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .status-badge {
            font-size: 0.8rem;
        }
        .pending { background-color: #ffc107; }
        .in_progress { background-color: #17a2b8; }
        .processing { background-color: #17a2b8; }
        .generating { background-color: #0dcaf0; }
        .completed { background-color: #28a745; }
        .error { background-color: #dc3545; }
        .file-link {
            display: block;
            margin: 5px 0;
            padding: 5px 10px;
            border-radius: 5px;
            text-decoration: none;
            color: #333;
            background-color: #f8f9fa;
            transition: all 0.2s ease;
        }
        .file-link:hover {
            background-color: #e9ecef;
            transform: translateX(5px);
        }
        .file-icon {
            margin-right: 10px;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Генератор SEO & Фидов</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Семантическое ядро</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/feeds">Фиды товаров</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        {% block content %}{% endblock %}
    </div>

    <footer class="bg-dark text-white text-center py-3 mt-5">
        <div class="container">
            <p class="mb-0">© 2023 Генератор семантического ядра и фидов</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
